spring:
  application:
    name: sistema-chamados

  # Configuração do Banco de Dados H2
  datasource:
    url: jdbc:h2:mem:chamadosdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Configuração do H2 Console (Navegador)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuração do Hibernate / JPA
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# Porta da aplicação
server:
  port: 8080