<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <h2 class="mb-4 text-center">Gestão de Chamados de Suporte</h2>

        <!-- Formulário para Criar Chamado -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Novo Chamado</h5>
            </div>
            <div class="card-body">
                <form id="form-chamado">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="titulo" class="form-label">Título</label>
                            <input type="text" id="titulo" class="form-control" placeholder="Ex: Impressora offline" required>
                        </div>
                        <div class="col-md-3">
                            <label for="cliente" class="form-label">Cliente</label>
                            <input type="text" id="cliente" class="form-control" placeholder="Nome do solicitante" required>
                        </div>
                        <div class="col-md-3">
                            <label for="prioridade" class="form-label">Prioridade</label>
                            <select id="prioridade" class="form-select">
                                <option value="BAIXA">Baixa</option>
                                <option value="MEDIA" selected>Média</option>
                                <option value="ALTA">Alta</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea id="descricao" class="form-control" rows="2" placeholder="Descreva o problema em detalhes"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3">Criar Chamado</button>
                </form>
            </div>
        </div>

        <!-- Tabela de Chamados -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Lista de Chamados</h5>
                <button class="btn btn-sm btn-outline-light" onclick="carregarChamados()">Atualizar</button>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Cliente</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Técnico</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-chamados">
                        <!-- Linhas geradas via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8080/api/chamados";

        // Busca e carrega os chamados na tabela
        async function carregarChamados() {
            try {
                const res = await fetch(API_URL);
                const chamados = await res.json();
                const tbody = document.getElementById("tabela-chamados");
                tbody.innerHTML = "";

                chamados.forEach(c => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${c.id}</td>
                        <td><strong>${c.titulo}</strong><br><small class="text-muted">${c.descricao || ''}</small></td>
                        <td>${c.cliente}</td>
                        <td><span class="badge ${badgePrioridade(c.prioridade)}">${c.prioridade}</span></td>
                        <td><span class="badge ${badgeStatus(c.status)}">${c.status}</span></td>
                        <td>${c.tecnico || '<em>Pendente</em>'}</td>
                        <td>
                            ${c.status === 'ABERTO' ? `<button class="btn btn-sm btn-warning me-1" onclick="atribuir(${c.id})">Assumir</button>` : ''}
                            ${c.status === 'EM_ANDAMENTO' ? `<button class="btn btn-sm btn-success me-1" onclick="finalizar(${c.id})">Concluir</button>` : ''}
                            <button class="btn btn-sm btn-danger" onclick="deletar(${c.id})">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Erro ao carregar chamados:", err);
            }
        }

        // Evento de envio do formulário
        document.getElementById("form-chamado").addEventListener("submit", async (e) => {
            e.preventDefault();
            const novoChamado = {
                titulo: document.getElementById("titulo").value,
                cliente: document.getElementById("cliente").value,
                prioridade: document.getElementById("prioridade").value,
                descricao: document.getElementById("descricao").value
            };

            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(novoChamado)
            });

            document.getElementById("form-chamado").reset();
            carregarChamados();
        });

        // Altera status para EM_ANDAMENTO e insere o técnico
        async function atribuir(id) {
            const tecnico = prompt("Digite o nome do técnico:");
            if (tecnico) {
                await fetch(`${API_URL}/${id}/atribuir?tecnico=${encodeURIComponent(tecnico)}`, { method: "PUT" });
                carregarChamados();
            }
        }

        // Altera status para FECHADO
        async function finalizar(id) {
            await fetch(`${API_URL}/${id}/finalizar`, { method: "PUT" });
            carregarChamados();
        }

        // Deleta o chamado
        async function deletar(id) {
            if (confirm("Deseja realmente excluir este chamado?")) {
                await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                carregarChamados();
            }
        }

        // Utilitários de estilo para os Badges do Bootstrap
       function badgePrioridade(p) {
        if (!p) return 'bg-secondary';
        const prioridade = p.toUpperCase();
        return prioridade === 'ALTA' ? 'bg-danger' : prioridade === 'MEDIA' ? 'bg-warning text-dark' : 'bg-info text-dark';
        }

        function badgeStatus(s) {
            return s === 'ABERTO' ? 'bg-secondary' : s === 'EM_ANDAMENTO' ? 'bg-primary' : 'bg-success';
        }

        // Carrega os dados ao abrir a página
        carregarChamados();
    </script>

</body>
</html>
